<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalogo — Assistente alla spesa</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Catalogo</h1>
  <p class="subtitle">
    Incremento Fase 1 — validazione del modello dominio tramite
    interfaccia utente reale
  </p>

  <section>
    <h2>Meta-articoli</h2>
    <ul id="meta-articles-list"></ul>
  </section>

  <section>
    <h2>Nuovo articolo</h2>
    <form id="form-nuovo-articolo">
      <input
        type="text"
        id="input-nome-articolo"
        placeholder="Nome articolo (es. Rio Mare Tonno all'olio)"
        required
      >
      <button type="submit">Crea articolo</button>
    </form>
  </section>

  <section>
    <h2>Associa articolo a meta-articolo</h2>
    <form id="form-associazione">
      <select id="select-meta-articolo-associazione" required></select>
      <select id="select-articolo-associazione" required></select>
      <button type="submit">Associa</button>
    </form>
  </section>

  <section>
    <h2>Nuovo formato</h2>
    <form id="form-nuovo-formato">
      <select id="select-articolo-formato" required></select>
      <input
        type="text"
        id="input-nome-formato"
        placeholder="Formato (es. 80 g)"
        required
      >
      <button type="submit">Crea formato</button>
    </form>
  </section>

  <section>
    <h2>Relazioni</h2>
    <div id="relations-container"></div>
  </section>

  <p id="stato" class="subtitle"></p>

  <script type="module" src="app.js"></script>
</body>
</html>
