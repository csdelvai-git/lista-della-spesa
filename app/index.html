<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalogo — Assistente alla spesa</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="app-nav">
    <a href="index.html" aria-current="page">Catalogo</a>
    <a href="lista.html">Lista della spesa</a>
  </nav>

  <h1>Catalogo</h1>
  <p class="subtitle">
    Fase 2.5 — navigazione a colonne: meta-articolo → articolo →
    formato
  </p>

  <section>
    <h2>Nuovo meta-articolo</h2>
    <form id="form-nuovo-meta-articolo">
      <input
        type="text"
        id="input-nome-meta-articolo"
        placeholder="Nome meta-articolo (es. Tonno)"
        required
      >
      <button type="submit">Crea meta-articolo</button>
    </form>
  </section>

  <section class="catalogo-browser">
    <div class="colonne">
      <div class="colonna">
        <h3>Meta-articoli</h3>
        <div id="colonna-meta" class="colonna-corpo"></div>
      </div>

      <div class="colonna">
        <h3>Articoli</h3>
        <div id="colonna-articoli" class="colonna-corpo"></div>
        <form id="form-associa-esistente" class="colonna-form" hidden>
          <select id="select-associa-esistente" required></select>
          <button type="submit">Associa</button>
        </form>
        <form id="form-nuovo-articolo-associato" class="colonna-form" hidden>
          <input
            type="text"
            id="input-nuovo-articolo-associato"
            placeholder="Nuovo articolo"
            required
          >
          <button type="submit">Crea e associa</button>
        </form>
      </div>

      <div class="colonna">
        <h3>Formati</h3>
        <div id="colonna-formati" class="colonna-corpo"></div>
        <form id="form-nuovo-formato" class="colonna-form" hidden>
          <input
            type="text"
            id="input-nuovo-formato"
            placeholder="Nuovo formato (es. 80 g)"
            required
          >
          <button type="submit">Aggiungi formato</button>
        </form>
      </div>
    </div>

    <div id="barra-azioni" class="barra-azioni"></div>
  </section>

  <section>
    <h2>Relazioni</h2>
    <p class="subtitle">
      Vista di sola lettura — un articolo può appartenere a più
      meta-articoli (relazione N:M).
    </p>
    <div id="relations-container"></div>
  </section>

  <p id="stato" class="subtitle"></p>

  <script type="module" src="app.js"></script>
</body>
</html>
