<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista della spesa — Assistente alla spesa</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="app-nav">
    <a href="index.html">Catalogo</a>
    <a href="lista.html" aria-current="page">Lista della spesa</a>
  </nav>

  <h1 id="nome-lista">Lista della spesa</h1>
  <p class="subtitle">
    Incremento Fase 2 — lista-first, con specializzazione progressiva
    opzionale meta-articolo → articolo → formato
  </p>

  <section>
    <h2>Nuovo meta-articolo</h2>
    <form id="form-nuovo-meta-lista">
      <input
        type="text"
        id="input-nuovo-meta-lista"
        placeholder="Nome meta-articolo (es. Tonno)"
        required
      >
      <button type="submit">Crea (se non esiste)</button>
    </form>
  </section>

  <section class="catalogo-browser">
    <h2>Aggiungi alla lista</h2>
    <div class="colonne">
      <div class="colonna">
        <h3>Meta-articoli non ancora in lista</h3>
        <div id="colonna-meta-lista" class="colonna-corpo"></div>
        <label class="colonna-toggle">
          <input type="checkbox" id="checkbox-mostra-tutti">
          Mostra tutti (anche già in lista)
        </label>
      </div>
      <div class="colonna">
        <h3>Articoli</h3>
        <div id="colonna-articoli-lista" class="colonna-corpo"></div>
      </div>
      <div class="colonna">
        <h3>Formati</h3>
        <div id="colonna-formati-lista" class="colonna-corpo"></div>
      </div>
      <div class="colonna">
        <h3>Prezzi</h3>
        <div id="colonna-prezzi-lista" class="colonna-corpo"></div>
      </div>
    </div>

    <div id="riepilogo-selezione" class="barra-azioni"></div>
    <button type="button" id="btn-aggiungi-voce" disabled>Aggiungi alla lista</button>
  </section>

  <label class="colonna-toggle">
    <input type="checkbox" id="checkbox-mostra-cancellati">
    Mostra anche le voci cancellate
  </label>
  <ul id="lista-voci"></ul>

  <p id="stato" class="subtitle">Inizializzazione...</p>

  <script type="module" src="lista.js"></script>
</body>
</html>
